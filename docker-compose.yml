# Infraestrutura do desafio. `docker compose up` sobe:
#   postgres      banco de dados                         localhost:5432
#   storage       armazenamento compatível com S3        localhost:9000 (API S3) · localhost:9001 (console web)
#   storage-init  cria o bucket `tasks-files` e sai
#   llm-mock      o "LLM" que o seu worker vai chamar    localhost:8090 (contrato em MOCK_API.md)
#
# Entre containers, use os nomes dos serviços como host (postgres, storage, llm-mock).
# Da sua máquina, use localhost.
#
# A sua API e o seu worker também precisam subir com `docker compose up` — veja o bloco
# comentado no fim do arquivo.

services:
  postgres:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_USER: desafio
      POSTGRES_PASSWORD: desafio
      POSTGRES_DB: tasks
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desafio -d tasks"]
      interval: 2s
      timeout: 3s
      retries: 30

  storage:
    # RustFS: armazenamento de objetos com a mesma API do Amazon S3. Use o SDK da AWS
    # (ex.: @aws-sdk/client-s3) apontando o endpoint para cá, com `forcePathStyle: true`.
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_VOLUMES: /data
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  storage-init:
    image: amazon/aws-cli:2.38.0
    depends_on:
      storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        aws --endpoint-url http://storage:9000 s3api head-bucket --bucket tasks-files 2>/dev/null
        || aws --endpoint-url http://storage:9000 s3api create-bucket --bucket tasks-files
    restart: "no"

  llm-mock:
    image: ghcr.io/nash-dtvm/llm-mock:1.0.0
    environment:
      MOCK_API_KEY: mock-dev-key
    ports:
      - "8090:8080"

  # ---------------------------------------------------------------------------------------------
  # A SUA APLICAÇÃO. Descomente e ajuste: build, comandos, portas e variáveis são escolha sua.
  # O requisito é só que `docker compose up` suba tudo sem passos manuais.
  #
  # api:
  #   build: .
  #   command: ["node", "dist/api.js"]
  #   ports:
  #     - "3000:3000"
  #   env_file: .env
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     storage-init:
  #       condition: service_completed_successfully
  #
  # worker:
  #   build: .
  #   command: ["node", "dist/worker.js"]
  #   env_file: .env
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     storage-init:
  #       condition: service_completed_successfully
  #     llm-mock:
  #       condition: service_healthy

volumes:
  postgres-data:
  storage-data:
